# ═══════════════════════════════════════════════════════════════════════════
#  GitLab CI/CD — Android Wi-Fi Enabler
#
#  Pipeline stages:
#    docker  → build & push the Android builder image (on Dockerfile changes)
#    lint    → static analysis
#    test    → unit tests
#    build   → assemble debug + release APKs
#    release → create a GitLab Release with APK asset
#
#  Required CI/CD variables (Settings → CI/CD → Variables):
#    KEYSTORE_BASE64    Base-64 encoded release keystore
#    STORE_PASSWORD     Keystore password
#    KEY_ALIAS          Key alias
#    KEY_PASSWORD       Key password
#
#  The Docker image built in the "docker" stage is stored in the project's
#  GitLab Container Registry and reused by all subsequent stages.
# ═══════════════════════════════════════════════════════════════════════════

# Default image — rebuilt in the "docker" stage when Dockerfile changes.
# On first run you can bootstrap with the official JDK image and install deps
# manually, or pre-build and push the image out-of-band.
image: ${CI_REGISTRY_IMAGE}/android-builder:latest

variables:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Xmx4g -Xms512m"
  # Store Gradle caches inside the project dir so GitLab cache can pick them up
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle-home"
  FF_USE_FASTZIP: "true"

# ── Global cache ──────────────────────────────────────────────────────────────
cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle-home/caches/
    - .gradle-home/wrapper/
    - .gradle/
  policy: pull-push

stages:
  - docker
  - lint
  - test
  - build
  - release

# ── Common Android setup ──────────────────────────────────────────────────────
.android-setup: &android-setup
  before_script:
    - chmod +x gradlew

# ═══════════════════════════════════════════════════════════════════════════
#  STAGE: docker
# ═══════════════════════════════════════════════════════════════════════════

build-docker-image:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    # Rebuild the image only when the Dockerfile itself changes on main/master
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Dockerfile
    # Or trigger manually at any time
    - when: manual
      allow_failure: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE/android-builder:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t "$CI_REGISTRY_IMAGE/android-builder:latest"
        -t "$CI_REGISTRY_IMAGE/android-builder:$CI_COMMIT_SHORT_SHA"
        .
    - docker push "$CI_REGISTRY_IMAGE/android-builder:latest"
    - docker push "$CI_REGISTRY_IMAGE/android-builder:$CI_COMMIT_SHORT_SHA"
  tags:
    - docker

# ═══════════════════════════════════════════════════════════════════════════
#  STAGE: lint
# ═══════════════════════════════════════════════════════════════════════════

lint:
  stage: lint
  <<: *android-setup
  script:
    - ./gradlew lint
  artifacts:
    when: always
    name: "lint-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/reports/lint-results-*.html
    expire_in: 2 weeks

# ═══════════════════════════════════════════════════════════════════════════
#  STAGE: test
# ═══════════════════════════════════════════════════════════════════════════

unit-test:
  stage: test
  <<: *android-setup
  script:
    - ./gradlew test
  artifacts:
    when: always
    name: "test-results-${CI_COMMIT_SHORT_SHA}"
    reports:
      junit: app/build/test-results/**/*.xml
    paths:
      - app/build/reports/tests/
    expire_in: 2 weeks

# ═══════════════════════════════════════════════════════════════════════════
#  STAGE: build
# ═══════════════════════════════════════════════════════════════════════════

build-debug:
  stage: build
  <<: *android-setup
  script:
    - ./gradlew assembleDebug
  artifacts:
    name: "debug-apk-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 2 weeks

build-release:
  stage: build
  <<: *android-setup
  rules:
    # Always build release on version tags
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*/
    # Also build on default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Manual trigger on any branch
    - when: manual
      allow_failure: true
  script:
    # Decode and place keystore if credentials are available
    - |
      if [ -n "$KEYSTORE_BASE64" ]; then
        echo "Keystore found — building signed release APK"
        mkdir -p keystore
        echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
        export KEYSTORE_PATH="${CI_PROJECT_DIR}/keystore/release.jks"
      else
        echo "No keystore — building unsigned release APK"
      fi
    - ./gradlew assembleRelease
  after_script:
    # Remove keystore from the runner workspace after the build
    - rm -f keystore/release.jks
  artifacts:
    name: "release-apk-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days

# ═══════════════════════════════════════════════════════════════════════════
#  STAGE: release
# ═══════════════════════════════════════════════════════════════════════════

gitlab-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*/
  needs:
    - job: build-release
      artifacts: true
  script:
    - echo "Creating GitLab Release for tag ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Wi-Fi Enabler ${CI_COMMIT_TAG}"
    description: |
      ## Wi-Fi Enabler ${CI_COMMIT_TAG}

      Automatic Wi-Fi activation for Android 10+.

      ### Installation
      1. Download `app-release.apk` below
      2. Enable *Unknown sources* on your device if needed
      3. Open the APK to install

      ### Requirements
      - Android 10 (API 29) or higher
      - Google Play Services (geofence trigger)
    assets:
      links:
        - name: "app-release.apk"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/release/app-release.apk?job=build-release"
          filepath: "/app-release.apk"
          link_type: package
